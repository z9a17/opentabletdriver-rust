[package]
name = "opentabletdriver-rust"
version = "0.11.0"
edition = "2024"
license = "GPL-3.0-only"
description = "User-mode USB tablet driver for Wacom PTH-660 on Windows 11"

[workspace]
members = ["crates/otd-core", "crates/otd-plugin-api", "plugins/ema"]
# Cargo commands run in the root without -p also cover the core's tests.
default-members = [".", "crates/otd-core"]
resolver = "2"

[[bin]]
name = "opentabletdriver-rust"
path = "src/main.rs"

[[bin]]
name = "opentabletdriver-rust-ui"
path = "src/ui_main.rs"
test = false
bench = false

[dependencies]
otd-core = { path = "crates/otd-core" }
otd-plugin-api = { path = "crates/otd-plugin-api" }
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.1.6"
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Pipes", "Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }

[dev-dependencies]
# The counting allocator for allocation checks, in test executables only.
otd-core = { path = "crates/otd-core", features = ["test-alloc"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
