[package]
name = "opentabletdriver-rust"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
description = "User-mode USB tablet driver for Wacom PTH-660 on Windows 11"

[dependencies]
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.1.6"
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
