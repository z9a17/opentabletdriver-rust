# Place this profile beside the release executables and plugin DLL.
# Start with: opentabletdriver-rust.exe run --config driver.plugins.example.toml
# Check DLL loading without HID/input: opentabletdriver-rust.exe check-plugins driver.plugins.example.toml
rotation = 0

[[plugins]]
path = 'otd_ema_filter.dll'
kind = 'native'
enabled = true
settings_json = '{"alpha":0.35,"reset_ms":50}'

