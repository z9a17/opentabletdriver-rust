description = "Built-in Radial Follow with the tablet-space settings used on the development machine: first report, dead zone, partial and large moves, and the 50 ms redetection reset."
origin = "synthetic positions around the captured hover report"
virtual_screen = [0, 0, 4480, 1440]
monitors = [[0, 0, 2560, 1440], [2560, 0, 4480, 1080]]
end = "none"

profile = '''
[absolute]
clipping = true
limiting = false

[absolute.display]
Width = 2560.0
Height = 1440.0
X = 1280.0
Y = 720.0
Rotation = 0.0

[absolute.tablet]
Width = 85.0
Height = 47.8125
X = 110.0
Y = 23.90625
Rotation = 0.0

[bindings]
tip_enabled = true
eraser_enabled = true
tip_threshold_raw = 82
eraser_threshold_raw = 82

[[radial_follow]]
outer_radius = 0.7039
inner_radius = 0.302
smoothing_coefficient = 0.302
soft_knee_scale = 0.603
smoothing_leak_coefficient = 0.201
'''

[[step]]
at_ms = 100
report = "10 60 14 56 00 a3 16 00 00 00 07 04 00 00 00 00 28"
expect = "move 18808 39743"
note = "first report: more than 50 ms after start, so the filter resets to it"

[[step]]
at_ms = 105
report = "10 60 3c 56 00 a3 16 00 00 00 07 04 00 00 00 00 28"
expect = "none"
note = "+40 units (0.2 mm): inside the 0.302 mm inner radius"

[[step]]
at_ms = 110
report = "10 60 dc 56 00 a3 16 00 00 00 07 04 00 00 00 00 28"
expect = "move 19026 39743"
note = "+200 units (1 mm) from the start"

[[step]]
at_ms = 115
report = "10 60 e4 5d 00 a3 16 00 00 00 07 04 00 00 00 00 28"
expect = "move 22694 39743"
note = "+2000 units (10 mm)"

[[step]]
at_ms = 164.9
report = "10 60 e4 5d 00 a3 16 00 00 00 07 04 00 00 00 00 28"
expect = "move 22970 39743"
note = "same target 49.9 ms later: no reset"

[[step]]
at_ms = 214.9
report = "10 60 80 3e 00 40 1f 00 00 00 07 04 00 00 00 00 28"
expect = "move 5508 54865"
note = "exactly 50 ms later: resets to (16000, 8000)"
