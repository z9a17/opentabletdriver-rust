name: Rust checks

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/parity-evidence.py validate
      - run: python -m unittest discover -s scripts/tests -p 'test_parity_*.py'
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace --release
      - run: pwsh -File scripts/build-compat.ps1
      - name: Native DLL integration
        shell: pwsh
        run: |
          $env:OTD_TEST_PLUGIN = (Resolve-Path target/release/otd_ema_filter.dll).Path
          cargo test --locked native_plugin_round_trip -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unchanged .NET plugin integration
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'RadialFollow.zip'
          Invoke-WebRequest 'https://github.com/AbstractQbit/AbstractOTDPlugins/releases/download/0.3.0/RadialFollow.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd3f5b0200015e6e90948ee5d7870742ac28d82922cc745e9f1f78527e59f8160') {
            throw 'Upstream RadialFollow archive checksum mismatch'
          }
          $pluginDirectory = Join-Path $env:RUNNER_TEMP 'RadialFollow'
          Expand-Archive -LiteralPath $archive -DestinationPath $pluginDirectory
          $env:OTD_COMPAT_DIR = (Resolve-Path target/release/compat).Path
          $env:OTD_TEST_DOTNET_PLUGIN = (Join-Path $pluginDirectory 'RadialFollow.dll')
          cargo test --locked dotnet_plugin_round_trip -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Managed discovery attribute integration
        shell: pwsh
        run: |
          dotnet restore compat/DiscoveryFixture/DiscoveryFixture.csproj --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build compat/DiscoveryFixture/DiscoveryFixture.csproj -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OTD_COMPAT_DIR = (Resolve-Path target/release/compat).Path
          $env:OTD_TEST_DISCOVERY_PLUGIN = (Resolve-Path compat/DiscoveryFixture/bin/Release/net8.0/DiscoveryFixture.dll).Path
          cargo test --locked dotnet_discovery_respects_platform_and_ignore_attributes -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Managed setting defaults integration
        shell: pwsh
        run: |
          dotnet restore compat/SettingsFixture/SettingsFixture.csproj --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build compat/SettingsFixture/SettingsFixture.csproj -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OTD_COMPAT_DIR = (Resolve-Path target/release/compat).Path
          $env:OTD_TEST_SETTINGS_PLUGIN = (Resolve-Path compat/SettingsFixture/bin/Release/net8.0/SettingsFixture.dll).Path
          cargo test --locked dotnet_settings_match_upstream_null_and_default_rules -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked dotnet_tablet_reference_fields_and_properties_precede_load_callback -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked dotnet_tablet_reference_uses_selected_database_specification -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  portable-core:
    # The report pipeline and session loop must build and pass without Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked -p otd-core --all-targets -- -D warnings
      - run: cargo test --locked -p otd-core
